name: onyx ai deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{secrets.AWS_REGION}}
  AWS_ACCOUNT_ID: ${{secrets.AWS_ACCOUNT_ID}}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{env.AWS_REGION}}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      #  build gateway
      - name: Build Gateway
        run: |
          docker build \
          -f backend/gateway/Dockerfile \
          -t gateway backend

      - name: tag Gateway
        run: |
          docker tag gateway:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      - name: push gateway
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      # build auth service
      - name: Build Auth
        run: |
          docker build \
          -f backend/services/auth/Dockerfile \
          -t auth backend

      - name: tag Auth
        run: |
          docker tag auth:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth:latest

      - name: push auth
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth:latest

        # build chat

      - name: Build Chat
        run: |
          docker build \
          -f backend/services/chat/Dockerfile \
          -t chat backend

      - name: tag Chat
        run: |
          docker tag chat:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat:latest

      - name: push chat
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat:latest

      # build agent
      - name: Build Agent
        run: |
          docker build \
          -f backend/services/agent/Dockerfile \
          -t agent backend

      - name: tag Agent
        run: |
          docker tag agent:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent:latest

      - name: push agent
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent:latest

      # build billing
      - name: Build billing
        run: |
          docker build \
          -f backend/services/billing/Dockerfile \
          -t billing backend

      - name: tag billing
        run: |
          docker tag billing:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing:latest

      - name: push billing
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing:latest

      - name: deploy gateway
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.GATEWAY_SERVICE}} \
          --force-new-deployment

      - name: deploy auth
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.AUTH_SERVICE}} \
          --force-new-deployment

      - name: deploy chat
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.CHAT_SERVICE}} \
          --force-new-deployment

      - name: deploy agent
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.AGENT_SERVICE}} \
          --force-new-deployment

      - name: deploy billing
        run: |
          aws ecs update-service \
          --cluster ${{secrets.ECS_CLUSTER}} \
          --service ${{secrets.BILLING_SERVICE}} \
          --force-new-deployment

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{env.AWS_REGION}}

      - name: Upload to S3
        run: |
          aws s3 sync \
          frontend/dist \
          s3://${{secrets.S3_BUCKET}} \
          --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
